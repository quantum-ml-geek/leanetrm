name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Stock database and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record the verification environment
        shell: bash
        run: |
          printf 'Runner image: %s (%s)\n' "$ImageOS" "$ImageVersion"
          dotnet --info
          node --version
          npm --version
          python3 --version
          /usr/lib/postgresql/16/bin/postgres --version
          google-chrome --version
          dpkg-query -W tzdata libicu74
      - name: Run synthetic verification
        shell: bash
        run: |
          python3 tools/check_all.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --dotnet "$(command -v dotnet)" \
            --browser "$(command -v google-chrome)"
